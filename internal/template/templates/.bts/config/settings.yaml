# bts — Verify before you code
# Project-level settings. Skills read this file at startup and use
# these values instead of defaults. Delete a setting to use the default.

# Verification
verify:
  max_iterations: 3              # Convergence budget: consecutive rounds allowed to make no
                                 # progress on (critical, major, minor_resolvable) before the
                                 # loop must stop and ask. Enforced by `bts recipe log`, which
                                 # exits non-zero with [CONVERGENCE FAILED]. Evaluated per
                                 # verified document.
  max_rounds: 6                  # Total verify rounds allowed on one document, whatever they
                                 # measured. max_iterations judges progress, and every hole
                                 # found in that judgement was found after a recipe had already
                                 # escaped through it — one ran 17 rounds against a budget of 3.
                                 # This one only counts, so there is nothing to argue with.
                                 # At the cap: move open findings to Known Uncertainties with
                                 # the command that settles each, and start implementing.
                                 # 0 disables.
  max_section_lines: 300         # H2 section length at which `bts verify` reports span.
  max_document_lines: 400        # Whole-document length at which it reports span. A blueprint
                                 # carries what code cannot cheaply falsify, and that is short.
                                 # Section length and finding count correlate at r=+0.95, so
                                 # the length IS the finding count the completion gate will
                                 # later be asked to drive to zero. 0 disables either check.
  section_span_severity: major   # Severity for both span reports. "critical" or "major" make
                                 # `bts verify` exit non-zero; "minor_resolvable" and "info"
                                 # report without blocking — which is what it did while the
                                 # check was new, on 15 of 26 recipes in one project, with
                                 # nothing following. Either way it is a report to the operator
                                 # and to the verifying agent: it does NOT enter findings.jsonl
                                 # or verify-log.jsonl (those come from the <bts-findings> block
                                 # in verification.md), so no value here blocks <bts>DONE</bts>
                                 # on its own.
  evidence_ttl_days: 30          # How long a cached framework-claim lookup stays usable.
                                 # 0 = never expire. "unavailable" results always expire after
                                 # an hour so an outage never pins a claim.

  # The completion gate itself is NOT configurable. A spec finalizes only at
  # zero critical, zero major, and zero resolvable minor; [deferred] minors are
  # runtime watch-items and never block. That rule is fixed in the stop hook
  # (internal/hook/stop.go) on purpose — a project that can lower its own bar
  # has no bar. Earlier versions of this file listed require_zero_critical /
  # require_zero_major / allow_minor keys here; nothing ever read them, so they
  # were removed rather than left advertising a knob that does not exist.
  #
  # max_iterations above IS read, and every verify-log entry records the value
  # it was judged under (`budget` field). Changing it re-judges the convergence
  # verdict for a document's whole history, so `bts recipe log` prints a notice
  # when it changes mid-document.
  #
  # What a round CAN adjust is how much evidence completion needs, because a
  # verify round is a sample rather than a measurement. Measured on one recipe:
  # two consecutive rounds over a byte-identical document disagreed by two
  # criticals and nine majors; rounds following no edit at all still averaged
  # 8.9 previously-unseen findings; and findings tracked how hard the round
  # looked (r=+0.69 vs subagents spawned) far more than what changed in the
  # document (r=+0.16 vs edits).
  confirm_passes: 2              # Consecutive clean FULL passes, running every dimension, over
                                 # the SAME recorded revision, before <bts>DONE</bts> is allowed.
                                 # Editing the document resets the count — that is the point.
                                 # 1 restores the old single-round rule.

# Debate
debate:
  rounds: 3                      # 3 rounds: positions → rebuttals → synthesis (covers full argument cycle)
  max_extensions: 3              # After 3 extensions, new information is unlikely — force decision
  expert_count: 3                # 3 perspectives: enough diversity without diluting focus

# Simulation
simulate:
  min_scenarios: 5               # Below 5, too easy to miss an important path
  max_scenarios: 12              # Ceiling for one round. The floor is a number; the ceiling used
                                 # to be the wireframe — "every edge of the state diagram, plus one
                                 # per illegal cell" scales with the diagram, and the diagram grows
                                 # BECAUSE simulation found something. One measured recipe went
                                 # 16→20 components and 12→19 paths in a single revision, so the
                                 # next round cost more for having worked. Illegal cells come first,
                                 # then the riskiest edges; whatever does not fit is reported as
                                 # uncovered, never dropped in silence. 0 = no ceiling.
  scenario_batch: 3              # Scenarios per walking agent. One agent walking all of them walks
                                 # them one after another in one context: 15 scenarios took 23
                                 # minutes on 132 tool calls, so the cost is reasoning, not reading.
                                 # Batches make the round cost the slowest batch, not the sum.
                                 # 0 = one agent for everything (pre-v0.16 behaviour).

# Implementation
implement:
  max_build_retries: 8           # Hard cap on TOTAL attempts per task. 8 = full retry ladder
                                 # (3 syntactic + 2 semantic + 1 spec + 1 domain + 1 architect).
                                 # Below 8 the upper escalation tiers become unreachable.
  max_test_iterations: 5         # If 5 fix cycles don't resolve it, human help needed
  midrun_review_every: 5         # Run a lightweight structural review every N tasks. 0 disables.
  retry_ladder:
    syntactic_max: 3             # In-place retries (tier 1) before moving to strategy switch
    semantic_max: 2              # Strategy switches (tier 2) before spec escalation
    spec_escalate: true          # Tier 3: re-read final.md block + /bts-verify
    domain_escalate: true        # Tier 4: re-verify domain.md invariant ownership
    architect_escalate: true     # Tier 5: re-enter /bts-architect

# Fix recipe
fix:
  debate_rounds: 1               # Known bugs need quick resolution, not extended deliberation

# Debug recipe
debug:
  debate_rounds: 1               # Quick analysis, not full debate
  perspective_count: 6           # 6 lenses for root cause: data, deps, design, runtime, history, impact

# Vision & Roadmap
vision:
  size_threshold: 15             # Above 15 files, a single recipe risks context overflow
  max_roadmap_items: 8           # Beyond 8, the roadmap itself becomes hard to track
  min_roadmap_items: 3           # Below 3, decomposition adds overhead without benefit

# Agent models — options: sonnet, opus, haiku
# Core gates (verify, audit, simulate, review-quality, review-security, review-arch) use session model by default.
#   review-security is recall-bound: semantic flaws (authz bypass, state-dependent privilege
#   escalation) missed by the initial sweep can never be rescued by the rebuttal step.
# Deep reasoning (review-rebuttal, simulator-rebuttal, diagnosis-validator, diagnosis-rebuttal) uses session model — needs concrete scenario construction and code path tracing.
# Pattern-based checks (review-validator, simulator-validator) default to sonnet via agent
# frontmatter; cross-check and sync-check run on sonnet via their SKILL.md `model:` field.
agents:
  # verifier: sonnet
  # auditor: sonnet
  # simulator: sonnet
  # reviewer_quality: sonnet
  # reviewer_security: sonnet
  # reviewer_arch: sonnet
  # reviewer_validator: sonnet
  # reviewer_rebuttal: sonnet
  # simulator_validator: sonnet
  # simulator_rebuttal: sonnet
  # diagnosis_validator: sonnet
  # diagnosis_rebuttal: sonnet

# Skill effort levels are configured in each skill's frontmatter
# (.claude/skills/<name>/SKILL.md, `effort:` field — low/medium/high/xhigh/max).
# Nothing reads an effort section from this file; current assignments:
# domain-model/architect/verify/simulate/audit = max (deep-reasoning gates;
# domain-model's invariant ownership and state-cell enumeration cascade into
# everything downstream), wireframe = xhigh (path-enumeration design),
# discover/research/debate/adjudicate/review = high (structure carries the
# quality; conversational or multi-round stages), status = low.
# Unset skills (assess, implement, test, …) inherit the session effort.
