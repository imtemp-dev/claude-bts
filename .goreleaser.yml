version: 2

# Pinned rather than inferred from the repo name: archives are named
# {{ .ProjectName }}_..., and install.sh downloads jig_<version>_<os>_<arch>.
# Letting this drift with the repo name breaks the installer at release time,
# where nothing is watching.
project_name: jig

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/jig/
    binary: jig
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/imtemp-dev/jig/pkg/version.Version={{.Version}}
      - -X github.com/imtemp-dev/jig/pkg/version.Commit={{.Commit}}
      - -X github.com/imtemp-dev/jig/pkg/version.Date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc

brews:
    # Explicit: without it the formula takes the project name (jig), so
    # `brew install jig` — what the binary is called and what every doc says —
    # would fail.
  - name: jig
    repository:
      owner: imtemp-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/imtemp-dev/jig
    description: "Verify before you code — catches spec errors before they become debugging sessions"
    license: MIT
    install: |
      bin.install "jig"
    test: |
      system "#{bin}/jig", "--version"

release:
  github:
    owner: imtemp-dev
    name: jig
